<text x="30" y="734" fill="#6b7280">PK = clé primaire · FK = clé étrangère · 1 / N = cardinalités. Un joueur peut avoir plusieurs souscriptions (historique) ; une seule est en cours.</text>
<text x="30" y="758" fill="#6b7280">Suppression d'un joueur : ses souscriptions disparaissent (CASCADE). Le niveau d'accès d'un jeu (0 = gratuit) est comparé au niveau de l'abonnement en cours.</text>
<text x="30" y="792" fill="#6b7280">Fonctions : fn_niveau_utilisateur · fn_peut_acceder — Procédures : sp_souscrire · sp_resilier · sp_abonnement_actuel · sp_souscriptions_utilisateur · sp_jeux_abonnement</text>
<text x="30" y="814" fill="#6b7280">Triggers : trg_souscription_bi (prix, nom, niveau, date de fin) · trg_projet_bi / trg_projet_bu (niveau d'accès valide)</text>
</svg>
